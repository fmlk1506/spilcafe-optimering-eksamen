<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Spilcaféen | Forside</title>

    <link rel="stylesheet" href="css/forside.css" />
    <link rel="stylesheet" href="css/navigation.css" />

    <link
      rel="shortcut icon"
      href="https://images.squarespace-cdn.com/content/v1/61fd2c9026a58c435d260f4c/1af90772-e642-4309-a2cb-f4161e36855e/SC-logo-2023-transparant-BG+Small+Crop.png"
      type="image/png"
    />
  </head>

  <body>
    <main class="home">
      <section class="home-hero">
        <img
          src="images/logo-spilcafeen.webp"
          alt="Spilcaféen"
          class="home-hero__logo"
        />

        <div class="home-hero__content">
          <h1>Find dit<br />næste spil</h1>

          <p>
            Find et brætspil, der passer<br />
            til jer. Søg eller filtrér blandt<br />
            caféens spil.
          </p>

          <div class="home-hero__actions">
            <a href="spil.html" class="hero-btn hero-btn--primary">
              <svg
                class="hero-btn__icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
              >
                <circle cx="11" cy="11" r="6"></circle>
                <path d="M16 16l4 4"></path>
              </svg>

              <span>Find et spil</span>

              <svg
                class="hero-btn__arrow"
                aria-hidden="true"
                viewBox="0 0 24 24"
              >
                <path d="M5 12h14"></path>
                <path d="m14 7 5 5-5 5"></path>
              </svg>
            </a>

            <a href="#" class="hero-btn hero-btn--secondary">
              <svg
                class="hero-btn__icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
              >
                <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                <path d="M8 3v4M16 3v4M4 9h16"></path>
                <path d="M8 13h2M12 13h2M16 13h1M8 17h2M12 17h2"></path>
              </svg>

              <span>Reservér bord</span>

              <svg
                class="hero-btn__arrow"
                aria-hidden="true"
                viewBox="0 0 24 24"
              >
                <path d="M5 12h14"></path>
                <path d="m14 7 5 5-5 5"></path>
              </svg>
            </a>
          </div>
        </div>

        <img src="images/hero-forside.webp" alt="" class="home-hero__image" />
      </section>

      <!-- Populære spil -->
      <section class="popular-games">
        <div class="popular-games__header">
          <h2>Populære spil</h2>

          <a href="spil.html" class="popular-games__link">
            <span>Se alle spil</span>
            <span aria-hidden="true">→</span>
          </a>
        </div>

        <div class="popular-games__grid" id="popular-games">
          <!-- De tre spil indsættes med JavaScript -->
        </div>
      </section>

      <!-- Find det rette spil -->
      <section class="game-finder">
        <div class="game-finder__content">
          <h2>Ved du ikke,<br />hvad I skal spille?</h2>

          <p>
            Find et spil ud fra antal spillere,<br />
            alder, kategori og spilletid
          </p>

          <a href="spil.html" class="game-finder__button">
            <span>Find det rette spil</span>
            <span aria-hidden="true">→</span>
          </a>
        </div>

        <div class="game-finder__illustration">
          <img src="images/spil-samler-mennesker.svg" alt="" loading="lazy" />
        </div>
      </section>
    </main>

    <div id="navigation"></div>

    <script src="js/navigation.js"></script>
    <script src="js/forside.js"></script>
  </body>
</html>
