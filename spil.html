<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Spil | Spilcaféen</title>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="icon" href="images/logo-spilcafeen.webp" type="image/webp" />
  </head>

  <body>
    <header class="games-header">
      <a href="index.html" aria-label="Gå til forsiden">
        <img
          src="images/logo-spilcafeen.webp"
          alt="Spilcaféen"
          class="games-header__logo"
        />
      </a>
    </header>

    <section id="booking-view" class="booking" hidden>
      <div id="booking-stage" class="booking-stage"></div>
    </section>

    <main class="page">
      <div class="games-intro">
        <h1>Spil</h1>
        <p>Find det rette spil til jer</p>
      </div>

      <div class="searchbar">
        <label for="search-input" class="visually-hidden">
          Søg efter spil
        </label>

        <input
          type="text"
          id="search-input"
          placeholder="Søg efter et spil..."
        />

        <button class="icon-btn" type="button" aria-label="Søg">🔍</button>
      </div>

      <div class="filter-actions">
        <button
          class="filter-action filter-action--primary"
          type="button"
          id="open-filters"
          aria-expanded="false"
          aria-controls="filter-panel"
        >
          <svg
            class="filter-action__icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 7h16M7 12h10M10 17h4"></path>
          </svg>

          <span>Filtrér</span>
        </button>
      </div>

      <section class="active-filters" id="active-filters" hidden>
        <h2>Aktive filtre</h2>

        <div
          class="active-filters__list"
          id="active-filters-list"
          aria-live="polite"
        ></div>
      </section>

      <div class="filter-panel" id="filter-panel" hidden>
        <div class="filter-panel__header">
          <div>
            <h2>Filtrér spil</h2>
            <p>Vælg de kriterier, der passer til jer</p>
          </div>

          <button
            class="filter-panel__close"
            id="close-filters"
            type="button"
            aria-label="Luk filtre"
          >
            ×
          </button>
        </div>

        <div class="filter-panel__content">
          <div class="filter-group">
            <h3>Kategori</h3>

            <div class="filter-options">
              <button
                class="filter-option"
                type="button"
                data-filter="genre"
                data-value="Strategi"
                aria-pressed="false"
              >
                Strategi
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="genre"
                data-value="Familie"
                aria-pressed="false"
              >
                Familie
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="genre"
                data-value="Selskab"
                aria-pressed="false"
              >
                Selskab
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="genre"
                data-value="Børn"
                aria-pressed="false"
              >
                Børn
              </button>
            </div>
          </div>

          <div class="filter-group">
            <h3>Antal spillere</h3>

            <div class="filter-options">
              <button
                class="filter-option"
                type="button"
                data-filter="players"
                data-value="1-2"
                aria-pressed="false"
              >
                1 - 2
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="players"
                data-value="2-4"
                aria-pressed="false"
              >
                2 - 4
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="players"
                data-value="4-6"
                aria-pressed="false"
              >
                4 - 6
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="players"
                data-value="6-10"
                aria-pressed="false"
              >
                6+
              </button>
            </div>
          </div>

          <div class="filter-group">
            <h3>Alder</h3>

            <div class="filter-options">
              <button
                class="filter-option"
                type="button"
                data-filter="age"
                data-value="6"
                aria-pressed="false"
              >
                6+
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="age"
                data-value="10"
                aria-pressed="false"
              >
                10+
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="age"
                data-value="12"
                aria-pressed="false"
              >
                12+
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="age"
                data-value="18"
                aria-pressed="false"
              >
                18+
              </button>
            </div>
          </div>

          <div class="filter-group">
            <h3>Spilletid</h3>

            <div class="filter-options">
              <button
                class="filter-option"
                type="button"
                data-filter="duration"
                data-value="0-30"
                aria-pressed="false"
              >
                &lt; 30 min
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="duration"
                data-value="30-60"
                aria-pressed="false"
              >
                30 - 60 min
              </button>

              <button
                class="filter-option"
                type="button"
                data-filter="duration"
                data-value="60-120"
                aria-pressed="false"
              >
                60+ min
              </button>
            </div>
          </div>
        </div>

        <div class="filter-panel__actions">
          <button type="button" class="filter-show-results" id="show-results">
            Vis spil
          </button>

          <button class="clear-pill" id="clear-filters-pill" type="button">
            Nulstil alle filtre
          </button>
        </div>
      </div>

      <section
        id="game-list"
        class="card-grid"
        aria-label="Spiloversigt"
      ></section>
    </main>

    <div id="game-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>

      <article
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button class="modal-close" type="button" data-close aria-label="Luk">
          ×
        </button>

        <div class="modal-media">
          <img id="modal-image" alt="" />
        </div>

        <div class="modal-body">
          <h2 id="modal-title"></h2>

          <div class="modal-meta" id="modal-meta"></div>

          <p id="modal-desc"></p>

          <div class="modal-details" id="modal-details"></div>

          <section id="modal-rules-wrap" class="modal-rules" hidden>
            <button
              id="rules-toggle"
              class="rules-btn"
              type="button"
              aria-expanded="false"
            >
              ▸ Regler
            </button>

            <div id="rules-content" class="rules-content">
              <pre id="modal-rules"></pre>
            </div>
          </section>
        </div>
      </article>
    </div>

    <div
      class="favourite-feedback"
      id="favourite-feedback"
      role="status"
      aria-live="polite"
      hidden
    >
      <span class="favourite-feedback__check" aria-hidden="true"> ✓ </span>

      <span id="favourite-feedback-text"> Tilføjet til favoritter </span>

      <button
        class="favourite-feedback__close"
        id="close-favourite-feedback"
        type="button"
        aria-label="Luk besked"
      >
        ×
      </button>
    </div>

    <div id="navigation"></div>

    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
