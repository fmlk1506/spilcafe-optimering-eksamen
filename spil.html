<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Spil | Spilcaféen</title>

    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="navigation.css" />

    <link rel="icon" href="images/logo-spilcafeen.webp" type="image/webp" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="games-header">
      <a href="index.html" aria-label="Gå til forsiden">
        <img
          src="images/logo-spilcafeen.webp"
          alt="Spilcaféen"
          class="games-header__logo"
        />
      </a>
    </header>

    <!-- BOOKING -->
    <section id="booking-view" class="booking" hidden>
      <div id="booking-stage" class="booking-stage"></div>
    </section>

    <!-- SPILOVERSIGT -->
    <main class="page">
      <div class="games-intro">
        <h1>Spil</h1>
        <p>Find det rette spil til jer</p>
      </div>

      <!-- SØGNING -->
      <div class="searchbar">
        <label for="search-input" class="visually-hidden">
          Søg efter spil
        </label>

        <input
          type="text"
          id="search-input"
          placeholder="Søg efter et spil..."
        />

        <button class="icon-btn" type="button" aria-label="Søg">🔍</button>
      </div>

      <!-- FILTER OG SORTERING -->
      <div class="filter-actions">
        <button
          class="filter-action filter-action--primary"
          type="button"
          id="open-filters"
          aria-expanded="false"
          aria-controls="filter-panel"
        >
          <svg
            class="filter-action__icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 7h16M7 12h10M10 17h4"></path>
          </svg>

          <span>Filtrér</span>
        </button>

        <button
          class="filter-action filter-action--secondary"
          type="button"
          id="open-sort"
        >
          <span>Sortér</span>
          <span aria-hidden="true">↓</span>
        </button>
      </div>

      <!-- FILTERPANEL -->
      <div class="filter-panel" id="filter-panel" hidden>
        <div class="filter-panel__header">
          <h2>Filtrér spil</h2>

          <button
            class="filter-panel__close"
            id="close-filters"
            type="button"
            aria-label="Luk filtre"
          >
            ×
          </button>
        </div>

        <div class="filter-panel__content">
          <!-- KATEGORI -->
          <div class="filter-dropdown">
            <button class="pill" type="button">Kategori ⌄</button>

            <div class="dropdown-menu">
              <button type="button" data-filter="genre" data-value="Familie">
                Familie
              </button>

              <button type="button" data-filter="genre" data-value="Kortspil">
                Kortspil
              </button>

              <button type="button" data-filter="genre" data-value="Strategi">
                Strategi
              </button>

              <button type="button" data-filter="genre" data-value="Ordspil">
                Ordspil
              </button>

              <button type="button" data-filter="genre" data-value="Party">
                Party
              </button>

              <button type="button" data-filter="genre" data-value="Andre">
                Andre
              </button>

              <button type="button" data-filter="genre" data-value="all">
                Alle kategorier
              </button>
            </div>
          </div>

          <!-- SPILLERE -->
          <div class="filter-dropdown">
            <button class="pill" type="button">Spillere ⌄</button>

            <div class="dropdown-menu">
              <button type="button" data-filter="players" data-value="1-2">
                1–2
              </button>

              <button type="button" data-filter="players" data-value="2-4">
                2–4
              </button>

              <button type="button" data-filter="players" data-value="4-6">
                4–6
              </button>

              <button type="button" data-filter="players" data-value="6-10">
                6–10
              </button>

              <button type="button" data-filter="players" data-value="10+">
                10+
              </button>

              <button type="button" data-filter="players" data-value="all">
                Alle
              </button>
            </div>
          </div>

          <!-- ALDER -->
          <div class="filter-dropdown">
            <button class="pill" type="button">Alder ⌄</button>

            <div class="dropdown-menu">
              <button type="button" data-filter="age" data-value="3">3+</button>
              <button type="button" data-filter="age" data-value="6">6+</button>
              <button type="button" data-filter="age" data-value="8">8+</button>
              <button type="button" data-filter="age" data-value="10">
                10+
              </button>
              <button type="button" data-filter="age" data-value="12">
                12+
              </button>
              <button type="button" data-filter="age" data-value="15">
                15+
              </button>
              <button type="button" data-filter="age" data-value="18">
                18+
              </button>

              <button type="button" data-filter="age" data-value="all">
                Alle
              </button>
            </div>
          </div>

          <!-- VARIGHED -->
          <div class="filter-dropdown">
            <button class="pill" type="button">Varighed ⌄</button>

            <div class="dropdown-menu">
              <button type="button" data-filter="duration" data-value="0-15">
                ≤ 15 min
              </button>

              <button type="button" data-filter="duration" data-value="15-30">
                15–30 min
              </button>

              <button type="button" data-filter="duration" data-value="30-60">
                30–60 min
              </button>

              <button type="button" data-filter="duration" data-value="60-120">
                60–120 min
              </button>

              <button type="button" data-filter="duration" data-value="120+">
                120+ min
              </button>

              <button type="button" data-filter="duration" data-value="all">
                Alle
              </button>
            </div>
          </div>

          <button class="clear-pill" id="clear-filters-pill" type="button">
            Ryd filtre
          </button>
        </div>
      </div>

      <!-- SPILLENE SKAL VISES HER -->
      <section
        id="game-list"
        class="card-grid"
        aria-label="Spiloversigt"
      ></section>
    </main>

    <!-- SKJULTE FELTER SOM APP.JS STADIG BRUGER -->
    <div class="filters-storage" hidden>
      <select id="genre-select">
        <option value="all">Alle kategorier</option>
      </select>

      <select id="language-select">
        <option value="all">Alle sprog</option>
      </select>

      <select id="difficulty-select">
        <option value="all">Alle sværhedsgrader</option>
      </select>

      <input type="number" id="rating-from" min="0" max="5" step="0.1" />

      <input type="number" id="rating-to" min="0" max="5" step="0.1" />

      <input type="number" id="playtime-from" min="0" max="600" />

      <input type="number" id="playtime-to" min="0" max="999" />

      <input type="checkbox" id="available-only" />

      <select id="sort-select">
        <option value="none">Ingen sortering</option>
        <option value="title">Titel (A-Å)</option>
        <option value="playtime">Varighed</option>
        <option value="rating">Rating</option>
      </select>

      <button id="clear-filters" type="button">Ryd</button>
    </div>

    <!-- MODAL -->
    <div id="game-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>

      <article
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button class="modal-close" type="button" data-close aria-label="Luk">
          ×
        </button>

        <div class="modal-media">
          <img id="modal-image" alt="" />
        </div>

        <div class="modal-body">
          <h2 id="modal-title"></h2>

          <div class="modal-meta" id="modal-meta"></div>

          <p id="modal-desc"></p>

          <div class="modal-details" id="modal-details"></div>

          <section id="modal-rules-wrap" class="modal-rules" hidden>
            <button
              id="rules-toggle"
              class="rules-btn"
              type="button"
              aria-expanded="false"
            >
              ▸ Regler
            </button>

            <div id="rules-content" class="rules-content">
              <pre id="modal-rules"></pre>
            </div>
          </section>
        </div>
      </article>
    </div>

    <!-- NAVIGATION -->
    <div id="navigation"></div>

    <script src="navigation.js"></script>
    <script src="app.js"></script>
  </body>
</html>
